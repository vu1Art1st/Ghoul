services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ghoul}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ghoul}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ghoul} -d ${POSTGRES_DB:-ghoul}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Host-network SOCKS5 bridge for services bound to the host loopback.
  # It is intentionally limited to loopback targets and Docker/loopback sources.
  host-loopback-proxy:
    image: mianhuatang11/ghoul:${GHOUL_TAG:-${ARTEX_TAG:-latest}}
    network_mode: host
    entrypoint: ["/app/hostproxy"]
    environment:
      GHOUL_LOOPBACK_PROXY_PORT: ${GHOUL_LOOPBACK_PROXY_PORT:-11080}
    command:
      - "-listen"
      - "0.0.0.0:${GHOUL_LOOPBACK_PROXY_PORT:-11080}"
      - "-allow-source"
      - "${GHOUL_LOOPBACK_PROXY_ALLOW_SOURCES:-127.0.0.1/32,172.16.0.0/12,::1/128}"
      - "-allow-target"
      - "${GHOUL_LOOPBACK_PROXY_ALLOW_TARGETS:-127.0.0.0/8,::1/128}"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 \"$${GHOUL_LOOPBACK_PROXY_PORT}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ghoul:
    # 镜像源由本仓库自维护。
    # 正常部署直接拉取本镜像；拉取失败（或想改代码）时本地构建：
    #   docker compose build
    image: mianhuatang11/ghoul:${GHOUL_TAG:-${ARTEX_TAG:-latest}}
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      host-loopback-proxy:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GHOUL_PG_DSN: postgres://${POSTGRES_USER:-ghoul}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ghoul}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GHOUL_LLM_PROVIDER: ${GHOUL_LLM_PROVIDER:-${ARTEX_LLM_PROVIDER:-}}
      GHOUL_LLM_MODEL: ${GHOUL_LLM_MODEL:-${ARTEX_LLM_MODEL:-}}
      GHOUL_LLM_BASE_URL: ${GHOUL_LLM_BASE_URL:-${ARTEX_LLM_BASE_URL:-}}
      GHOUL_LLM_PROXY: ${GHOUL_LLM_PROXY:-${ARTEX_LLM_PROXY:-}}
      GHOUL_LLM_STREAM: ${GHOUL_LLM_STREAM:-${ARTEX_LLM_STREAM:-}}
      GHOUL_NOTIFY_ALLOW_LOCAL: ${GHOUL_NOTIFY_ALLOW_LOCAL:-${ARTEX_NOTIFY_ALLOW_LOCAL:-}}
      GHOUL_BTW_MAX_OUTPUT_TOKENS: ${GHOUL_BTW_MAX_OUTPUT_TOKENS:-${ARTEX_BTW_MAX_OUTPUT_TOKENS:-}}
      TOSHELL_API_KEY: ${TOSHELL_API_KEY:-}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 本地配置包含 C2 等运行开关；config.json 被 .gitignore 忽略。
      - ./config.json:/app/config.json:ro
      # 把数据目录（含 jwt.key、SQLite 等）绑定到项目根目录的 data/，
      # 方便在宿主机直接查看/备份，容器重建也不丢。
      - ./data:/app/data
      - ./jwt.key:/app/jwt.key
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
    restart: unless-stopped
