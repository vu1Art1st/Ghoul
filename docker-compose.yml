services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ghoul}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ghoul}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ghoul} -d ${POSTGRES_DB:-ghoul}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ghoul:
    # 镜像源由本仓库自维护。
    # 正常部署直接拉取本镜像；拉取失败（或想改代码）时本地构建：
    #   docker compose build
    image: mianhuatang11/ghoul:${GHOUL_TAG:-${ARTEX_TAG:-latest}}
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GHOUL_PG_DSN: postgres://${POSTGRES_USER:-ghoul}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ghoul}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GHOUL_LLM_PROVIDER: ${GHOUL_LLM_PROVIDER:-${ARTEX_LLM_PROVIDER:-}}
      GHOUL_LLM_MODEL: ${GHOUL_LLM_MODEL:-${ARTEX_LLM_MODEL:-}}
      GHOUL_LLM_BASE_URL: ${GHOUL_LLM_BASE_URL:-${ARTEX_LLM_BASE_URL:-}}
      GHOUL_LLM_PROXY: ${GHOUL_LLM_PROXY:-${ARTEX_LLM_PROXY:-}}
      GHOUL_LLM_STREAM: ${GHOUL_LLM_STREAM:-${ARTEX_LLM_STREAM:-}}
      GHOUL_NOTIFY_ALLOW_LOCAL: ${GHOUL_NOTIFY_ALLOW_LOCAL:-${ARTEX_NOTIFY_ALLOW_LOCAL:-}}
      GHOUL_BTW_MAX_OUTPUT_TOKENS: ${GHOUL_BTW_MAX_OUTPUT_TOKENS:-${ARTEX_BTW_MAX_OUTPUT_TOKENS:-}}
      TOSHELL_API_KEY: ${TOSHELL_API_KEY:-}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 把数据目录（含 jwt.key、SQLite 等）绑定到项目根目录的 data/，
      # 方便在宿主机直接查看/备份，容器重建也不丢。
      - ./data:/app/data
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
